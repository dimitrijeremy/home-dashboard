services:

  # ── MediaMTX: media server (RTSP in, HLS out) ─────────────────────────────
  # Di Mac lokal: TIDAK dijalankan di sini, jalankan binary mediamtx di host:
  #   ./mediamtx mediamtx.yml
  # Di server Linux: jalankan bersama lewat docker compose up
  mtx:
    build: ./mtx
    volumes:
      - ./mtx/mediamtx.yml:/app/mediamtx.yml:ro
      - ./mtx/start_stream.sh:/app/start_stream.sh:ro
    environment:
      - DVR_HOST=10.10.30.2
      - DVR_USER=dashboard
      - DVR_PASS=d4$$hb0ard-dlt
    networks:
      - hd-net
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5001:5000"   # opsional, untuk debug langsung ke API
    environment:
      # BASE_URL kosong → stream_url disimpan sebagai path relatif (/ch1/index.m3u8)
      # Nginx di frontend container mem-proxy path /chN/ dan /custom_*/ ke mtx:8888
      - BASE_URL=
      # INTERNAL_HLS_URL: digunakan backend untuk cek stream status (container-to-container)
      - INTERNAL_HLS_URL=http://mtx:8888
      - DB_PATH=/data/cameras.db
      - FACE_PHOTO_DIR=/data/face_photos
      - SNAPSHOT_DIR=/data/snapshots
      - DVR_HOST=10.10.30.2
      - DVR_HTTP_PORT=80
      - DVR_USER=dashboard2
      - DVR_PASS=d4$$hb0ard-dlt
      # Event stream NVR butuh akun dengan hak operator/admin Dahua.
      # Set DVR_EVENT_USER + DVR_EVENT_PASS untuk akun dengan hak lebih tinggi.
      # Jika kosong, fallback ke DVR_USER/DVR_PASS.
      - DVR_EVENT_USER=
      - DVR_EVENT_PASS=
      # MTX_HOST + RTSP_PORT: digunakan start_custom_stream.sh di backend untuk
      # push stream custom ke mediamtx container via jaringan internal Docker.
      - MTX_HOST=mtx
      - RTSP_PORT=8554
      # Camera siren/speaker (DH-P5AE-PV or similar with built-in speaker)
      - SIREN_CAMERA_HOST=
      - SIREN_CAMERA_USER=
      - SIREN_CAMERA_PASS=
      - SIREN_ENABLED=true
      # Smart Door Lock (Paloma DLP6202 via Tuya Cloud)
      - TUYA_ACCESS_ID=
      - TUYA_ACCESS_SECRET=
      - TUYA_DEVICE_ID=
      - TUYA_REGION=us
    volumes:
      - camera_data:/data
    networks:
      - hd-net

  analyzer:
    build: ./analyzer
    environment:
      - BACKEND_URL=http://backend:5000
      - MTX_RTSP=rtsp://mtx:8554
      - SNAPSHOT_DIR=/data/snapshots
      - PROCESS_EVERY=8
      - FACE_THRESH=0.40
      - ZONE_CONF=0.40
      - COOLDOWN_SECS=20
    volumes:
      - camera_data:/data
    depends_on:
      - backend
    networks:
      - hd-net
    # Analyzer opsional — tidak ikut 'docker compose up' biasa
    profiles:
      - ai

  frontend:
    build: ./frontend
    ports:
      # Ganti 8088 ke port yang tersedia di server (80 dan 443 biasanya sudah terpakai).
      # Akses dashboard: http://<server-ip>:8088
      # Atau tambahkan sebagai vhost di reverse proxy yang sudah ada (lihat README).
      - "8088:80"
    depends_on:
      - backend
    networks:
      - hd-net

networks:
  hd-net:
    driver: bridge

volumes:
  camera_data:

