services:

  # ── Resource limits (cpus/mem_limit) ──────────────────────────────────────
  # Tanpa batasan, satu container yang spike (ffmpeg transcode atau AI
  # analyzer) bisa menghabiskan seluruh CPU host dan bikin SEMUA service
  # (termasuk dashboard-nya sendiri) ikut freeze, bukan cuma stream yang berat.
  # Nilai di bawah ini titik awal yang aman untuk mini PC/NUC 4 core — cek
  # `nproc` dan `free -h` di server, lalu sesuaikan. `docker stats` saat
  # sistem terasa berat akan menunjukkan container mana yang jadi biang CPU.

  # ── MediaMTX: media server (RTSP in, HLS out) ─────────────────────────────
  # Di Mac lokal: TIDAK dijalankan di sini, jalankan binary mediamtx di host:
  #   ./mediamtx mediamtx.yml
  # Di server Linux: jalankan bersama lewat docker compose up
  #
  # Kredensial & host NVR TIDAK ditulis di file ini — isi lewat file .env
  # (lihat .env.example). Nilai env hanya seed awal; setelah itu dikelola dari
  # menu konfigurasi dashboard (tersimpan di database).
  mtx:
    build: ./mtx
    cpus: 3.0
    mem_limit: 1536m
    # Hardware encode (Intel Quick Sync/VAAPI) — OFF by default, aman untuk
    # semua server. Untuk aktifkan (butuh NUC/PC dengan iGPU Intel):
    #   1. Cek dulu di server: ls /dev/dri   → harus ada card0 + renderD128.
    #      Kalau tidak ada, JANGAN uncomment baris `devices:` di bawah —
    #      compose akan gagal start service ini sama sekali.
    #   2. Uncomment 2 baris `devices:` di service ini DAN service `backend`.
    #   3. Set HWACCEL=vaapi di .env server.
    #   4. docker compose up -d --build, lalu cek log: `docker compose logs mtx`
    #      — kalau ffmpeg error soal vaapi/renderD128, set HWACCEL kosong lagi
    #      untuk rollback instan ke software encode (tanpa perlu revert compose).
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - ./mtx/mediamtx.yml:/app/mediamtx.yml:ro
      - ./mtx/start_stream.sh:/app/start_stream.sh:ro
      # Read-only: cuma untuk baca /data/.internal_token yang di-generate backend
      # (autentikasi server-to-server ke /api/nvr-config — lihat DEPLOY.md § Auth).
      - camera_data:/data:ro
    environment:
      # Fallback bila backend belum siap; nilai utama diambil dari
      # /api/nvr-config backend (database).
      - DVR_HOST=${DVR_HOST:-}
      - DVR_USER=${DVR_USER:-}
      - DVR_PASS=${DVR_PASS:-}
      - HWACCEL=${HWACCEL:-}
      - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
    depends_on:
      - backend
    networks:
      - hd-net
    restart: unless-stopped

  backend:
    build: ./backend
    cpus: 1.5
    mem_limit: 768m
    # Hardware encode (custom stream channel) — lihat catatan lengkap di
    # service `mtx` di atas. Uncomment bareng dengan devices: di `mtx`.
    # devices:
    #   - /dev/dri:/dev/dri
    ports:
      - "5001:5000"   # opsional, untuk debug langsung ke API
    environment:
      # BASE_URL kosong → stream_url disimpan sebagai path relatif (/ch1/index.m3u8)
      # Nginx di frontend container mem-proxy path /chN/ dan /custom_*/ ke mtx:8888
      - BASE_URL=
      # INTERNAL_HLS_URL: digunakan backend untuk cek stream status (container-to-container)
      - INTERNAL_HLS_URL=http://mtx:8888
      - MTX_API_URL=http://mtx:9997
      - DB_PATH=/data/cameras.db
      - FACE_PHOTO_DIR=/data/face_photos
      - SNAPSHOT_DIR=/data/snapshots
      # Seed awal konfigurasi NVR — hanya dipakai saat database masih kosong.
      # Setelah itu, ubah dari menu Konfigurasi > Kredensial NVR di dashboard.
      - DVR_HOST=${DVR_HOST:-}
      - DVR_HTTP_PORT=${DVR_HTTP_PORT:-80}
      - DVR_USER=${DVR_USER:-}
      - DVR_PASS=${DVR_PASS:-}
      # Event stream NVR butuh akun dengan hak operator/admin Dahua.
      # Jika kosong, fallback ke DVR_USER/DVR_PASS.
      - DVR_EVENT_USER=${DVR_EVENT_USER:-}
      - DVR_EVENT_PASS=${DVR_EVENT_PASS:-}
      # Jumlah channel built-in NVR (seed awal setting builtin_channel_count)
      - NVR_CHANNELS=${NVR_CHANNELS:-4}
      # MTX_HOST + RTSP_PORT: digunakan start_custom_stream.sh di backend untuk
      # push stream custom ke mediamtx container via jaringan internal Docker.
      - MTX_HOST=mtx
      - RTSP_PORT=8554
      - HWACCEL=${HWACCEL:-}
      - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
      # Seed user pertama — hanya dipakai saat tabel users masih kosong.
      # GANTI passwordnya lewat menu Konfigurasi > Users setelah login pertama.
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      # Sesi browser idle lebih dari ini (menit) wajib login ulang.
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-10}
      # Set "true" hanya kalau dashboard diakses lewat reverse proxy HTTPS —
      # HTTP polos (default LAN) wajib biarkan ini kosong/false.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Whitelist segmen yang boleh login (seed awal; sesudahnya via UI).
      # EXTRA_LOGIN_CIDRS = pintu darurat anti-lockout (selalu di-union).
      - ALLOWED_LOGIN_CIDRS=${ALLOWED_LOGIN_CIDRS:-10.10.100.0/24,10.10.80.0/24,127.0.0.1/32}
      - EXTRA_LOGIN_CIDRS=${EXTRA_LOGIN_CIDRS:-}
      # Interval scan keamanan NVR (akun baru + log login), detik
      - NVR_SECURITY_SCAN_SECS=${NVR_SECURITY_SCAN_SECS:-300}
      # Postgres monitoring mirror (DBeaver) — PG_HOST kosong = mati
      - PG_HOST=pg
      - PG_PORT=5432
      - PG_DB=${PG_DB:-monitoring}
      - PG_USER=${PG_USER:-monitor}
      - PG_PASS=${PG_PASS:-monitor-change-me}
    volumes:
      - camera_data:/data
      # Docker socket (read-only) untuk panel resource server di dashboard
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hd-net
    restart: unless-stopped

  analyzer:
    build: ./analyzer
    cpus: 3.0
    mem_limit: 2g
    environment:
      - BACKEND_URL=http://backend:5000
      - MTX_RTSP=rtsp://mtx:8554
      - SNAPSHOT_DIR=/data/snapshots
      - PROCESS_EVERY=${PROCESS_EVERY:-8}
      - FACE_THRESH=${FACE_THRESH:-0.40}
      - ZONE_CONF=${ZONE_CONF:-0.40}
      - COOLDOWN_SECS=${COOLDOWN_SECS:-20}
      # Face recognition maksimal 1x per N detik per channel (hemat CPU)
      - FACE_EVERY_SECS=${FACE_EVERY_SECS:-2.0}
      # Ukuran inferensi YOLO — turunkan ke 480/416 untuk hemat CPU signifikan
      - YOLO_IMGSZ=${YOLO_IMGSZ:-640}
    volumes:
      - camera_data:/data
    depends_on:
      - backend
    networks:
      - hd-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    cpus: 0.5
    mem_limit: 256m
    ports:
      # Ganti 8088 ke port yang tersedia di server (80 dan 443 biasanya sudah terpakai).
      # Akses dashboard: http://<server-ip>:8088 atau https://<server-ip>:8443
      # Atau tambahkan sebagai vhost di reverse proxy yang sudah ada (lihat README).
      - "8088:80"
      - "8443:443"
    volumes:
      # Sertifikat TLS — isi dengan tls/gen-certs.sh di host (lihat MONITORING.md).
      # Kalau kosong, container membuat self-signed sementara supaya tetap start.
      - ./tls/certs:/etc/nginx/tls
    depends_on:
      - backend
    networks:
      - hd-net
    restart: unless-stopped

  # ── Postgres: monitoring DB terpisah (akses DBeaver dari luar) ────────────
  # Berisi SALINAN read-only tabel monitoring (login_log, detection_events,
  # nvr_events, cameras ter-redact) — bukan DB utama aplikasi. Kalau DB ini
  # mati/di-reset, dashboard tetap jalan normal dan data tersinkron ulang.
  pg:
    image: postgres:16-alpine
    cpus: 1.0
    mem_limit: 512m
    environment:
      - POSTGRES_DB=${PG_DB:-monitoring}
      - POSTGRES_USER=${PG_USER:-monitor}
      # GANTI di .env — port ini terekspos ke LAN untuk DBeaver.
      - POSTGRES_PASSWORD=${PG_PASS:-monitor-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - hd-net
    restart: unless-stopped

networks:
  hd-net:
    driver: bridge

volumes:
  camera_data:
  pg_data:
