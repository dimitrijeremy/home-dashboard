# ── HTTP (port 80 → host 8088) ────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal resolver — dibutuhkan agar proxy_pass dengan variabel bekerja
    # (resolusi DNS di-defer ke request time, bukan saat startup)
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/includes/locations.inc;
}

# ── HTTPS (port 443 → host 8443) ──────────────────────────────────────────────
# Sertifikat dari volume ./tls/certs (buat dengan tls/gen-certs.sh di host,
# lihat MONITORING.md § HTTPS). Kalau volume kosong, entrypoint container
# membuat self-signed sementara supaya nginx tetap bisa start.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/includes/locations.inc;
}
