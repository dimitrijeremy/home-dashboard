logLevel: info
readTimeout: 30s
writeTimeout: 30s

# HLS settings
hlsSegmentDuration: 4s
hlsSegmentMaxSize: 50MB
hlsAllowOrigins:
  - "*"
hlsAlwaysRemux: yes

# Architecture: mediamtx manages ffmpeg subprocesses directly via runOnInit.
# start_stream.sh stores the DVR password — avoids mediamtx $VAR expansion issue.
# runOnInitRestart: yes → mediamtx auto-restarts ffmpeg if it crashes.
paths:
  ch1:
    runOnInit: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 1
    runOnInitRestart: yes

  ch2:
    runOnInit: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 2
    runOnInitRestart: yes

  ch3:
    runOnInit: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 3
    runOnInitRestart: yes

  ch4:
    runOnInit: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 4
    runOnInitRestart: yes

  '~^custom_[0-9a-f]+$': {}
