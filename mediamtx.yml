logLevel: info
readTimeout: 30s
writeTimeout: 30s

# HLS settings
hlsSegmentDuration: 4s
hlsSegmentMaxSize: 50MB
hlsAllowOrigins:
  - "*"
hlsAlwaysRemux: yes

# On-demand streaming: ffmpeg starts only when a viewer connects,
# and stops after all viewers disconnect (saves CPU/bandwidth when idle).
paths:
  ch1:
    runOnDemand: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 1
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  ch2:
    runOnDemand: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 2
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  ch3:
    runOnDemand: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 3
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  ch4:
    runOnDemand: /Users/dimitrijeremy/Documents/home-dashboard/home-dashboard/start_stream.sh 4
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  '~^custom_[0-9a-f]+$': {}
