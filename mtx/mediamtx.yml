logLevel: info
readTimeout: 30s
writeTimeout: 30s
api: yes
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50MB
hlsVariant: mpegts
# hlsAllowOrigins:
#   - "*"
hlsAlwaysRemux: yes

# On-demand streaming: ffmpeg starts only when a viewer connects,
# and stops after all viewers disconnect (saves CPU/bandwidth when idle).
paths:
  ch1:
    runOnDemand: /app/start_stream.sh 1
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  ch2:
    runOnDemand: /app/start_stream.sh 2
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  ch3:
    runOnDemand: /app/start_stream.sh 3
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  ch4:
    runOnDemand: /app/start_stream.sh 4
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 30s

  '~^custom_[0-9a-f]+$': {}
