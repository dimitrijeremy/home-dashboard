logLevel: info
readTimeout: 30s
writeTimeout: 30s
api: yes
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50MB
hlsVariant: fmp4
# hlsAllowOrigins:
#   - "*"
hlsAlwaysRemux: yes

# Streams always running: ffmpeg starts on mediamtx startup and restarts on failure.
# runOnDemand tidak dipakai karena MediaMTX v1.9 tidak trigger runOnDemand via HLS reader.
paths:
  ch1:
    runOnInit: /app/start_stream.sh 1
    runOnInitRestart: yes

  ch2:
    runOnInit: /app/start_stream.sh 2
    runOnInitRestart: yes

  ch3:
    runOnInit: /app/start_stream.sh 3
    runOnInitRestart: yes

  ch4:
    runOnInit: /app/start_stream.sh 4
    runOnInitRestart: yes

  '~^custom_[0-9a-f]+$': {}
