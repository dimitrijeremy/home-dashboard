logLevel: info
readTimeout: 30s
writeTimeout: 30s
api: yes
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api

hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50MB
hlsVariant: mpegts
# hlsAllowOrigins:
#   - "*"
# hlsAlwaysRemux HARUS off untuk mode on-demand — kalau on, muxer HLS menjadi
# reader permanen sehingga publisher tidak pernah dimatikan saat idle.
hlsAlwaysRemux: no

# start_stream.sh di-mount ke /app/ via docker-compose volume.
# Channel built-in NVR (ch1, ch2, …, chN) di-serve ON-DEMAND:
# ffmpeg hanya dijalankan saat ada viewer/analyzer yang membaca path,
# dan dimatikan lagi setelah idle (runOnDemandCloseAfter). Jumlah channel
# tidak lagi hardcode — cukup atur builtin_channel_count di dashboard.
paths:
  '~^ch([0-9]+)$':
    runOnDemand: /app/start_stream.sh $MTX_PATH
    runOnDemandRestart: yes
    # NVR Dahua lewat RTSPS bisa lambat handshake TLS; beri ruang cukup
    # supaya publisher tidak keburu dibunuh sebelum stream sempat mulai.
    runOnDemandStartTimeout: 45s
    runOnDemandCloseAfter: 60s

  '~^custom_[0-9a-f]+$': {}
